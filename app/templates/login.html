<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión Sheriff Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Estilo para los iconos sociales */
        .social-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            color: white;
        }

        .social-container p {
            font-size: 16px;
            margin: 0 0 8px 0;
            font-weight: bold;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            color: white;
            font-size: 30px; /* tamaño más grande */
            text-decoration: none;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .social-icons a:hover {
            transform: scale(1.2);
            color: #ffcc00;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Imagen de fondo -->
        <div class="image-section">
            <div class="overlay">
                <h1 class="title">Bienvenido a Sheriff Store</h1>
                <p class="subtitle">Tu lugar ideal para comprar tecnología</p>
            </div>
        </div>

        <!-- Formulario de login -->
        <div class="login-section">
            <div class="login-container">
                <h2>¡Hola de nuevo!</h2>
                <p>Ingresa para comenzar tus compras</p>
                <a class="login-btn" href="{{ url_for('google.login') }}">
                    Iniciar sesión con Google
                </a>
            </div>
        </div>
    </div>

    <!-- Iconos sociales abajo a la izquierda -->
    <div class="social-container">
        <p>Contáctenos</p>
        <div class="social-icons">
            <a href="https://www.facebook.com/jheyson.perez.560" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://wa.me/51905921931" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/jheysonperez_15/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@jheysonperez_15" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>
</body>
</html>
